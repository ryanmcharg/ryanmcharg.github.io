<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'Poppins',sans-serif;
  color:white;
  overflow-x:hidden;
  background: linear-gradient(-45deg,#0b0b0f,#111122,#0b0b0f,#1a1a2e);
  background-size:400% 400%;
  animation:bgMove 18s ease infinite;
}

@keyframes bgMove{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

/* Intro Splash */
#intro{
  position:fixed;width:100%;height:100vh;background:black;
  display:flex;justify-content:center;align-items:center;
  z-index:9999;animation:fadeOut 1s ease 2s forwards;
}
#intro h1{
  font-size:120px;font-weight:800;letter-spacing:10px;
  background:linear-gradient(90deg,#00f0ff,#8a2eff);
  -webkit-background-clip:text;color:transparent;
}
@keyframes fadeOut{to{opacity:0;visibility:hidden;}}

/* Hero */
.hero{
  height:100vh;display:flex;flex-direction:column;
  justify-content:center;padding:0 10%;
}
.hero h1{
  font-size:60px;font-weight:800;
  background:linear-gradient(90deg,#fff,#00f0ff);
  -webkit-background-clip:text;color:transparent;
}
.hero p{font-size:20px;color:#bbb;margin:20px 0;}

.btn{
  display:inline-block;padding:12px 28px;
  background:linear-gradient(90deg,#00f0ff,#8a2eff);
  color:black;border-radius:30px;font-weight:600;
  text-decoration:none;margin-right:10px;
  box-shadow:0 0 15px rgba(0,240,255,.5);
  transition:.3s;
}
.btn.secondary{
  background:white;color:black;box-shadow:none;
}
.btn:hover{
  transform:translateY(-3px);
  box-shadow:0 0 25px rgba(138,46,255,.8);
}

section{padding:100px 10%;}
.section-title{
  font-size:40px;margin-bottom:40px;
  border-left:5px solid #8a2eff;padding-left:15px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:30px;
}

.card{
  background:rgba(255,255,255,0.04);
  backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,0.1);
  padding:20px;border-radius:14px;
  transition:.3s;
}
.card:hover{
  transform:translateY(-6px);
  box-shadow:0 0 30px rgba(0,240,255,.2);
}

.about{display:grid;grid-template-columns:1fr 1fr;gap:40px;}
.about img{width:100%;border-radius:12px;}

.store-player{margin-bottom:15px;border-radius:8px;overflow:hidden;}

footer{text-align:center;padding:40px;color:#777;}

@media(max-width:800px){
  .hero h1{font-size:40px;}
  .about{grid-template-columns:1fr;}
}
</style>
</head>

<body>

<div id="intro"><h1>RM</h1></div>

<div class="hero">
  <h1>Ryan McHarg</h1>
  <p>Music Producer • Mixing • Custom Production</p>
  <a href="#music" class="btn">Listen</a>
  <a href="#store" class="btn secondary">Buy Beats</a>
</div>
